<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCEL · Seoul National University</title>
<meta name="description" content="Computational Catalysis and Emerging Materials Laboratory, Department of Materials Science and Engineering, Seoul National University.">
<script>
  /* decide the stage mode before first layout so #anchors land on the final positions */
  if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('scrub');
</script>
<link rel="preload" as="image" href="_shared/scroll/hero_poster.webp" fetchpriority="high">
<link rel="stylesheet" href="_shared/brand/brand.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip" href="#news">Skip to content</a>

<header class="site-hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="index.html"><img class="ccel-logo" data-logo src="_shared/img/logo2.png" width="200" height="102" alt="CCEL logo"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span class="bars"></span><span class="sr">Menu</span></button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        <li><a href="index.html" aria-current="page">Welcome</a></li>
        <li><a href="professor.html">Professor</a></li>
        <li><a href="members.html">Members</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main">
  <!-- Scroll stage: canvas scrubs the manifest's `hero` frames behind the title block, then resolves to white. -->
  <section id="stage" class="stage" aria-labelledby="lab-name">
    <div class="stage-pin">
      <div class="stage-media" aria-hidden="true">
        <img class="stage-poster" src="_shared/scroll/hero_poster.webp" alt="" decoding="async" fetchpriority="high">
        <canvas class="stage-canvas"></canvas>
      </div>
      <div class="wrap stage-body">
        <div class="stage-panel">
          <p class="eyebrow" id="lab-aff"></p>
          <h1 id="lab-name"></h1>
          <p class="identity" id="lab-tagline"></p>
        </div>
      </div>
      <p class="scroll-hint" aria-hidden="true">Scroll</p>
    </div>
    <noscript><p class="wrap">This site renders its content from a data file with JavaScript. Please enable JavaScript.</p></noscript>
  </section>

  <section id="news" class="sec" aria-labelledby="h-news">
    <div class="wrap two-col">
      <div>
        <div class="sec-head"><h2 id="h-news">News</h2></div>
        <ul class="news" id="news-list"></ul>
      </div>
      <div class="join" id="opening">
        <div class="sec-head"><h2 id="h-opening">Open Position</h2></div>
        <p lang="ko" id="opening-ko"></p>
        <a class="mail" id="join-mail" href="contact.html">Contact</a>
      </div>
    </div>
  </section>

  <section id="selected-publications" class="sec" aria-labelledby="h-selected">
    <div class="wrap">
      <div class="sec-head"><h2 id="h-selected">Selected Publications</h2></div>
      <ul class="sel" id="selected-list"></ul>
      <p class="sec-links"><a class="more" href="publications.html#selected">Full citations and Recent Highlights on the Publications page</a></p>
    </div>
  </section>

  <section id="about" class="sec" aria-labelledby="h-about">
    <div class="wrap">
      <div class="sec-head"><h2 id="h-about">About CCEL</h2></div>
      <div class="about">
        <div class="about-text">
          <p class="about-ko" lang="ko" id="about-ko"></p>
          <p class="sec-links"><a class="more" href="research.html">Research areas</a><a class="more" href="members.html">Members</a></p>
        </div>
        <figure class="fig" id="about-fig"></figure>
      </div>
    </div>
  </section>

</main>

<footer class="site-ftr" id="site-ftr"></footer>

<script src="_shared/content.js"></script>
<script src="assets/site.js"></script>
<script src="assets/home.js"></script>
<script src="assets/stage.js"></script>
</body>
</html>
