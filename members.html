<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members · CCEL</title>
<script>
  /* #alumni and #alumni-<group> open the alumni view; decided before first paint (people.js keeps it in sync) */
  if (/^#alumni(-|$)/.test(location.hash)) document.documentElement.classList.add('view-alumni');
</script>
<link rel="stylesheet" href="_shared/brand/brand.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="index.html"><img class="ccel-logo" data-logo src="_shared/img/logo2.png" width="200" height="102" alt="CCEL logo"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span class="bars"></span><span class="sr">Menu</span></button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Welcome</a></li>
        <li><a href="professor.html">Professor</a></li>
        <li><a href="members.html" aria-current="page">Members</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- Round v6: current members first, one person per row as on the current members.html; the Alumni button
     switches to the alumni view (#alumni), "Current members" switches back (#current). No professor section. -->
<main id="main" class="inner">
  <div class="page-head">
    <div class="wrap">
      <h1>Members</h1>
      <p class="lede" id="people-lede"></p>
      <nav class="gnav" id="people-subnav" aria-label="Member groups"></nav>
    </div>
  </div>
  <div class="wrap">
    <div class="toolbar" role="group" aria-labelledby="type-lbl">
      <span class="lbl" id="type-lbl">Research type</span>
      <div class="seg" id="type-filter"></div>
    </div>
    <div class="view v-current" id="current"></div>
    <section class="view v-alumni" id="alumni" aria-labelledby="h-alumni"></section>
    <p class="view-foot v-current"><a class="more" href="#alumni">Alumni</a></p>
    <p class="view-foot v-alumni"><a class="back" href="#current">Current members</a></p>
  </div>
</main>

<footer class="site-ftr" id="site-ftr"></footer>

<script src="_shared/content.js"></script>
<script src="assets/site.js"></script>
<script src="assets/people.js"></script>
</body>
</html>
